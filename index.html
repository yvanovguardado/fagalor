<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MANDINGA</title>

<style>
/* Layout: canvas 3D em ecrã inteiro, HUD sobreposto (bússola no topo, barras de Vida/Magia/Vigor em baixo), menus em cartões centrais. */
:root{
  --ink:#0d1014; --ink2:#151a20; --parch:#e3dccb; --muted:#939ca6;
  --gold:#c9a45c; --blood:#b3413a; --mana:#4f86c9; --stam:#74a35a; --line:rgba(227,220,203,.2);
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Alegreya Sans','Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%;background:var(--ink);color:var(--parch);font-family:var(--body);font-size:16px;overflow:hidden}
#boot-error{position:fixed;z-index:10000;inset:0;display:grid;place-items:center;padding:24px;background:#0d1014;color:#e3dccb;font:18px/1.55 'Segoe UI',sans-serif}
#boot-error[hidden]{display:none}#boot-error>div{max-width:620px}#boot-error h1{font:700 28px Georgia,serif;color:#e6c27a}
:focus-visible{outline:3px solid #ffd24a;outline-offset:3px}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
body.high-contrast{--parch:#fff;--muted:#d4dbe2;--gold:#ffe082;--line:rgba(255,255,255,.58)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;user-select:none}
#hud[hidden]{display:none}
#compass{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(480px,calc(100vw - 32px));height:auto;filter:drop-shadow(0 1px 3px #000)}
#target{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(260px,60vw);text-align:center;font-family:var(--display);font-size:13px;letter-spacing:.08em;opacity:0;transition:opacity .3s}
#target i{display:block;height:5px;margin-top:4px;background:rgba(0,0,0,.55);border:1px solid var(--line)}
#target b{display:block;height:100%;background:var(--blood);width:100%}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(227,220,203,.75);box-shadow:0 0 3px #000}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);padding:6px 14px;background:rgba(10,12,15,.7);border:1px solid var(--line);font-size:17px;white-space:nowrap;display:none}
#prompt kbd{font-family:var(--display);color:var(--gold);margin-right:6px}
#stats{position:absolute;top:12px;left:16px;font-family:var(--display);font-size:13px;letter-spacing:.06em;text-shadow:0 1px 3px #000}
#stats .xp{width:120px;height:3px;background:rgba(0,0,0,.6);margin:5px 0}
#stats .xp b{display:block;height:100%;background:var(--gold);width:0}
#tracker{position:absolute;top:56px;right:16px;max-width:min(240px,34vw);text-align:right;font-size:14px;line-height:1.35;text-shadow:0 1px 3px #000}
#tracker h4{margin:0 0 2px;font:500 12px var(--display);letter-spacing:.1em;color:var(--gold);text-transform:uppercase}
#log{position:absolute;left:16px;bottom:62px;display:flex;flex-direction:column;gap:3px;font-size:15px;text-shadow:0 1px 3px #000;max-width:min(420px,70vw)}
#log div{animation:fade 5s forwards}
@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.bars{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bar{flex:1;max-width:280px;min-width:0}
.bar.hp{max-width:340px}
.bar span{display:block;font:500 10px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;text-align:center}
.bar i{display:block;height:9px;background:rgba(0,0,0,.6);border:1px solid var(--line);position:relative}
.bar b{display:block;height:100%;width:100%;transition:width .12s}
.bar.hp b{background:var(--blood)}.bar.mp b{background:var(--mana)}.bar.st b{background:var(--stam)}
#dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,20,20,.75));opacity:0}
#night{position:absolute;inset:0;opacity:0;background:#000}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;background:rgba(6,8,11,.72)}
.overlay[hidden]{display:none}

.card{box-sizing:border-box;width:100%;max-width:640px;max-height:100%;overflow:auto;background:var(--ink2);border:1px solid var(--line);padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card.wide{max-width:860px}
.overlay.title .card{background:rgba(14,17,22,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-color:rgba(201,164,92,.35)}
.logo{margin:0 0 6px;text-align:center}
.logo img{display:block;margin:0 auto;width:min(100%,600px);max-height:33vh;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,.7))}
.card h1,.card h2{font-family:var(--display);font-weight:700;margin:0 0 8px;letter-spacing:.06em;text-wrap:balance}
.card h1{font-size:clamp(28px,6vw,46px);line-height:1.05;color:var(--gold)}
.card h2{font-size:22px;color:var(--gold)}
.card h3{font:500 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.card p{margin:0 0 12px;line-height:1.5;max-width:62ch}
.tag{color:var(--muted);font-size:17px;margin-bottom:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:500 14px var(--display);letter-spacing:.08em;color:var(--parch);background:transparent;border:1px solid var(--gold);padding:10px 16px;cursor:pointer;min-height:40px}
.btn:hover,.btn:focus-visible{background:rgba(201,164,92,.16)}

    const dx=a.tx-a.x,dz=a.tz-a.z,d=Math.hypot(dx,dz);if(d>.25){const step=Math.min(d,a.type==='dog'?1.1:0.55)*dt,p={x:a.x+dx/d*step,z:a.z+dz/d*step};resolve(p,.3);if(Math.hypot(p.x-a.x,p.z-a.z)>.001){a.x=p.x;a.z=p.z;a.g.position.set(a.x,terrainH(a.x,a.z),a.z);a.g.rotation.y=Math.atan2(dx,dz);a.ph+=dt*7;a.legs.forEach((l,i)=>{l.rotation.x=Math.sin(a.ph+i*PI)*.35})}}}
}

function log(msg,col){const d=document.createElement('div');d.textContent=msg;if(col)d.style.color=col;const l=$('log');l.appendChild(d);while(l.children.length>6)l.firstChild.remove();setTimeout(()=>d.remove(),5200)}
function updateHUD(){
  $('hpb').style.width=clamp(P.hp/maxHP()*100,0,100)+'%';
  $('mpb').style.width=clamp(P.mp/maxMP()*100,0,100)+'%';
  $('stb').style.width=clamp(P.st/maxST()*100,0,100)+'%';
  $('lvl').textContent=P.name+' · Nível '+P.lvl+(P.pts?' · +'+P.pts:'')+(P.perkPts?' · ✦'+P.perkPts:'');
  $('xpb').style.width=clamp(P.xp/xpNeed(P.lvl)*100,0,100)+'%';
  $('gold').textContent=P.gold+' ouro';
  let h='';
  for(const k in QUESTS){const q=P.q[k];if(q.s==='active')h+='<div>'+QUESTS[k].title+' '+(q.p>=QUESTS[k].goal?'(volta a '+(QUESTS[k].back||'Ngunza')+')':q.p+'/'+QUESTS[k].goal)+'</div>'}
  $('tracker').innerHTML=h?'<h4>Missões</h4>'+h:'';
}

const modal=$('modal');
function showModal(card,title){$('touch').hidden=true;resetTouch();modal.replaceChildren(card);modal.hidden=false;modal.classList.toggle('title',!!title)}
function setMode(m){
  mode=m;
  if(m==='play'){
    modal.hidden=true;$('hud').hidden=false;$('touch').hidden=!isTouch;
    if(!isTouch){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(lockFail)}catch(e){lockFail()}}
  }else if(document.pointerLockElement){try{document.exitPointerLock()}catch(e){}}
}
let everLocked=false;
function lockFail(){if(!everLocked)noLock=true;else log('Clica no ecrã para voltar a controlar a câmara.')}
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===canvas;if(locked)everLocked=true;
  if(!locked&&mode==='play'&&!noLock)openPause();
});

function levelUp(){
  while(P.xp>=xpNeed(P.lvl)){P.xp-=xpNeed(P.lvl);P.lvl++;P.pts+=2;P.perkPts=(P.perkPts||0)+1;P.hp=maxHP();P.mp=maxMP();P.st=maxST();sfx('level');log('Subiste para o nível '+P.lvl+'! +2 pontos de atributo (Menu > Personagem)','#e6c27a')}
}
function addXP(n){P.xp+=n;levelUp()}

function openTitle(){
  const c=el('div','card');

  const z=P.x>1500?1:0,lx=z?P.x-OX:P.x,ci=Math.floor((lx+200)/10),cj=Math.floor((P.z+200)/10);
  for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++){if(i*i+j*j>16)continue;const a=ci+i,b=cj+j;if(a>=0&&a<40&&b>=0&&b<40)EXP[z][b*40+a]=1}

const MAPC=[null,null];
function mapBase(z){
  if(MAPC[z])return MAPC[z];
  const N=100,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const wx=-200+(i+.5)*4,wz=-200+(j+.5)*4,h=terrainH(z?OX+wx:wx,wz),n=vnoise(wx*.1,wz*.1);let r,g,b;
    if(h<-.4){r=44;g=98;b=124}
    else if(!z){
      if(h<1.4){r=194;g=178;b=128}
      else{const t=clamp((h-4)/20,0,1);r=lerp(74,128,t);g=lerp(120,118,t);b=lerp(58,106,t);const sn=clamp((h-32)/10,0,1);r=lerp(r,236,sn);g=lerp(g,238,sn);b=lerp(b,242,sn)}
    }else{
      if(h<.9){r=170;g=150;b=108}
      else if(h<3.4&&vnoise(wx*.022+7,wz*.022)>.6){r=236;g=232;b=218}
      else{const t=clamp((h-6)/20,0,1);r=lerp(204,138,t);g=lerp(178,100,t);b=lerp(124,70,t)}
    }
    const k=.9+n*.2,o=(j*N+i)*4;im.data[o]=r*k;im.data[o+1]=g*k;im.data[o+2]=b*k;im.data[o+3]=255;
  }
  x.putImageData(im,0,0);MAPC[z]=c;return c;
}

  log('Viajaste para '+w.n+'.','#9fd4ff');save(false);setMode('play');
}

/* ---------- som ---------- */
let AC=null;
function tone(f1,f2,d,type,v,delay=0){if(!AC)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v,f){if(!AC)return;try{const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;const g=AC.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start()}catch(e){}}
function sfx(k){
  if(!settings.sfx)return;
  if(k==='swing')noise(.22,.35,1800);
  else if(k==='hit'){tone(160,50,.15,'square',.18);noise(.1,.3,900)}
  else if(k==='fire'){tone(300,900,.35,'sawtooth',.09);noise(.3,.2,600)}
  else if(k==='boom'){tone(110,30,.5,'sawtooth',.25);noise(.5,.5,300)}
  else if(k==='hurt'){tone(220,90,.25,'square',.2)}
  else if(k==='coin'){tone(880,1320,.12,'sine',.12);tone(1320,1760,.15,'sine',.1,.09)}
  else if(k==='level'){[523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,.3,'triangle',.14,i*.1))}
  else if(k==='potion'){tone(400,800,.25,'sine',.12)}
  else if(k==='chest'){tone(120,200,.3,'triangle',.18);noise(.25,.2,700)}
}

/* ---------- trilha sonora (gerada em tempo real) ---------- */
const SC=[0,2,3,5,7,8,10,12,14,15,17,19,20,22];
const PROG=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]];
const MOODS={title:{bpm:60,pad:.06,mel:.5,oct:1,drum:0},day:{bpm:76,pad:.045,mel:.34,oct:1,drum:0},night:{bpm:52,pad:.055,mel:.22,oct:0,drum:0},combat:{bpm:118,pad:.045,mel:.3,oct:0,drum:1}};
const mfreq=x=>146.83*Math.pow(2,x/12);
const Music={
  mood:'title',step:0,next:0,mi:4,master:null,bus:null,send:null,nbuf:null,
  init(){
    if(this.master||!AC)return;
    const m=AC.createGain();m.gain.value=settings.music?settings.vol:0;m.connect(AC.destination);this.master=m;
    const bus=AC.createGain();bus.connect(m);this.bus=bus;
    const d=AC.createDelay(1.5),fb=AC.createGain(),lp=AC.createBiquadFilter(),snd=AC.createGain();
    d.delayTime.value=.46;fb.gain.value=.4;lp.type='lowpass';lp.frequency.value=1800;snd.gain.value=.45;
    snd.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(m);this.send=snd;
    const n=AC.sampleRate,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;this.nbuf=b;
    this.next=AC.currentTime+.15;
    setInterval(()=>this.tick(),110);
  },
  setVol(){if(this.master&&AC)this.master.gain.setTargetAtTime(settings.music?settings.vol:0,AC.currentTime,.12)},
  setMood(m){this.mood=m},
  tick(){
    if(!AC||AC.state!=='running'||!this.master)return;
    if(this.next<AC.currentTime-.5)this.next=AC.currentTime+.05;
    while(this.next<AC.currentTime+.4){const sd=this.play(this.step,this.next);this.next+=sd;this.step++}
  },
  play(step,t){
    const M=MOODS[this.mood],sd=60/M.bpm/2,bar=Math.floor(step/8),s=step%8,ch=PROG[bar%4];
    if(s===0){this.pad(ch,t,sd*8,M.pad);this.bass(ch[0]-12,t,sd*(M.drum?1.6:6),this.mood)}
    if(M.drum&&s===4)this.bass(ch[0]-12,t,sd*1.6,this.mood);
    if((s%2===0&&Math.random()<M.mel)||(s===0&&Math.random()<.7)||(s%2===1&&Math.random()<M.mel*.35)){
      let x;
      if(Math.random()<.35)x=ch[Math.floor(Math.random()*3)]+12*(1+M.oct);
      else{this.mi=clamp(this.mi+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)],0,SC.length-1);x=SC[this.mi]+12*M.oct}
      this.pluck(x,t,this.mood==='night'?2.2:this.mood==='combat'?.35:1.4,this.mood==='combat'?.09:.11,this.mood==='night'?'sine':'triangle');
    }
    if(M.drum){
      if([1,0,0,1,1,0,1,0][s])this.kick(t);
      if(s===2||s===5||s===7)this.tom(t,s===5?260:200);
      if(s%2===1)this.hat(t);
    }
    return sd;
  },

let sceneNextFn=null;
function playCutscene(pages,done){
  mode='scene';if(document.pointerLockElement)document.exitPointerLock();
  $('hud').hidden=true;$('touch').hidden=true;resetTouch();modal.hidden=true;
  let sc=$('scene');if(!sc){sc=el('div');sc.id='scene';document.body.append(sc)}
  sc.hidden=false;let i=0;
  const finish=()=>{sc.hidden=true;sceneNextFn=null;done()};
  const next=()=>{i++;if(i<pages.length)show();else finish()};
  const show=()=>{
    const pg=pages[i],box=el('div','sbox');
    if(pg.a&&ART[pg.a]){const ar=el('div','sart');ar.innerHTML='<svg viewBox="0 0 480 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração da cena">'+ART[pg.a]+'</svg>';box.append(ar)}
    box.append(el('div','sk',pg.k),el('p','st',pg.t));
    const r=el('div','row');r.style.justifyContent='center';
    r.append(btn(i<pages.length-1?'Continuar':'Prosseguir',next,'main'),btn('Saltar',finish,'sm'));
    box.append(r);sc.replaceChildren(box);
  };
  sceneNextFn=next;show();
}

/* ---------- ecrã inteiro ---------- */
const fsRoot=document.documentElement;
const fsSupported=()=>!!(fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen);
const inFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFS(){
  try{
    if(inFS()){const x=document.exitFullscreen||document.webkitExitFullscreen;const r=x.call(document);if(r&&r.catch)r.catch(()=>{})}
    else if(fsSupported()){const r=(fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen).call(fsRoot);if(r&&r.catch)r.catch(()=>log('O ecrã inteiro não está disponível aqui.'))}
    else log('Este navegador não permite ecrã inteiro.');
  }catch(e){log('O ecrã inteiro não está disponível aqui.')}
}
function syncFS(){const b=$('fsbtn');b.hidden=!fsSupported();b.textContent=inFS()?'Sair do ecrã inteiro':'Ecrã inteiro';b.style.right=inFS()?'calc(98px + env(safe-area-inset-right,0px))':'';}
$('fsbtn').addEventListener('click',toggleFS);
document.addEventListener('fullscreenchange',syncFS);document.addEventListener('webkitfullscreenchange',syncFS);
syncFS();

/* ---------- entradas ---------- */
function doInteract(){
  if(mode!=='play'||!interact)return;
  if(interact.t==='chest')openChest(interact.o);
  else if(interact.t==='corpse')searchCorpse(interact.o);
  else if(interact.o.talk)interact.o.talk();
}
/* toque */
const joy={id:null,ox:0,oy:0,x:0,y:0,mag:0},look={id:null,lx:0,ly:0};
function resetTouch(){joy.id=null;joy.x=joy.y=joy.mag=0;look.id=null;keys.atk=false;keys.rmb=false;keys.space=false;$('joy').style.display='none';$('joyhint').style.display='';document.querySelectorAll('.tb.on').forEach(b=>b.classList.remove('on'))}
{
  const tl=$('tl'),jy=$('joy'),R_=55;
  const knob=jy.firstElementChild,hk=$('joyhint');
  tl.addEventListener('touchstart',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.clientX<innerWidth*.45&&joy.id===null){
        joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.x=joy.y=joy.mag=0;
        jy.style.display='block';jy.style.left=(t.clientX-60)+'px';jy.style.top=(t.clientY-60)+'px';knob.style.transform='';hk.style.display='none';
      }else if(look.id===null&&t.clientX>=innerWidth*.45){look.id=t.identifier;look.lx=t.clientX;look.ly=t.clientY}
    }
  },{passive:false});
  tl.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier===joy.id){
        let dx=t.clientX-joy.ox,dy=t.clientY-joy.oy;const d=Math.hypot(dx,dy);
        if(d>R_){dx*=R_/d;dy*=R_/d}
        knob.style.transform='translate('+dx+'px,'+dy+'px)';
        const m=Math.min(1,d/R_);joy.mag=m;
        if(m<.18){joy.x=joy.y=0}else{joy.x=dx/R_*(m-.18)/.82/(m||1);joy.y=dy/R_*(m-.18)/.82/(m||1)}
      }else if(t.identifier===look.id){
        P.yaw-=(t.clientX-look.lx)*.0062*settings.camSens;P.pitch=clamp(P.pitch-(t.clientY-look.ly)*.0062*settings.camSens,-1.45,1.45);
        look.lx=t.clientX;look.ly=t.clientY;
      }
    }
  },{passive:false});
  const end=e=>{
    for(const t of e.changedTouches){
      if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=joy.mag=0;jy.style.display='none';hk.style.display=''}
      if(t.identifier===look.id)look.id=null;
    }
  };
  tl.addEventListener('touchend',end);tl.addEventListener('touchcancel',end);
  const hold=(id,on,off)=>{const b=$(id);
    b.addEventListener('touchstart',e=>{e.preventDefault();b.classList.add('on');on()},{passive:false});
    const up=e=>{e.preventDefault();b.classList.remove('on');if(off)off()};
    b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false});
    b.addEventListener('click',e=>e.preventDefault());
  };
  hold('b-atk',()=>{keys.atk=true;if(!AC||AC.state==='suspended')try{AC&&AC.resume()}catch(_){}},()=>{keys.atk=false});
  hold('b-fire',()=>castFire());
  hold('b-blk',()=>{keys.rmb=true},()=>{keys.rmb=false});
  hold('b-jmp',()=>{keys.space=true},()=>{keys.space=false});
  hold('b-pot',()=>usePotion('hp'));
  $('pausebtn').addEventListener('click',()=>{if(mode==='play')openMenu('inv')});
  const pr=$('prompt');
  pr.addEventListener('touchstart',e=>{e.preventDefault();doInteract()},{passive:false});
  pr.addEventListener('click',()=>doInteract());
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('touchstart',()=>{if(!isTouch){isTouch=true;noLock=true;document.body.classList.add('touch');if(mode==='play')$('touch').hidden=false}},{once:true,passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')openPause()});
}
const KM={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ShiftLeft:'shift',ShiftRight:'shift',AltLeft:'alt',AltRight:'alt',ControlLeft:'ctrl',ControlRight:'ctrl',Space:'space',ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
addEventListener('keydown',e=>{
  const k=KM[e.code];
  if(k){keys[k]=true;if(mode==='play'&&(k==='space'||e.code.startsWith('Arrow')))e.preventDefault()}if(mode==='play'&&e.code==='Tab')e.preventDefault();
  if(e.repeat)return;
  if(mode==='play'){
    if(e.code==='KeyR')toggleWeapon();
    else if(e.code==='KeyQ')openMenu('fav');
    else if(e.code==='KeyZ')castFire();
    else if(e.code==='KeyE')doInteract();
    else if(e.code==='KeyH')usePotion('hp');
    else if(e.code==='KeyG')toggleFS();
    else if(e.code==='KeyI')openMenu('inv');
    else if(e.code==='Tab')openMenu('inv');
    else if(e.code==='KeyC')openMenu('char');
    else if(e.code==='KeyJ')openMenu('quest');
    else if(e.code==='KeyM')openMenu('map');
    else if(e.code==='Escape'||e.code==='KeyP')openPause();
  }else if(mode==='scene'){
    if(e.code==='Enter'||e.code==='Space'){if(sceneNextFn)sceneNextFn()}
  }else if(mode==='menu'){
    if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')&&e.code!=='Escape')return;
    if(e.code==='Escape'||e.code==='KeyI'||e.code==='KeyJ'||e.code==='KeyP'||e.code==='KeyC'||e.code==='KeyM'||e.code==='Tab'||e.code==='KeyQ')setMode('play');
  }
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
canvas.addEventListener('mousedown',e=>{
  if(mode!=='play')return;
  if(!locked&&!noLock){try{canvas.requestPointerLock()}catch(_){}return}
  if(e.button===0&&(locked||noLock))tryAttack();
  if(e.button===2)keys.rmb=true;
});
addEventListener('mouseup',e=>{if(e.button===2)keys.rmb=false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{
  if(mode!=='play')return;
  // Sem pointer lock, o movimento livre do rato controla a câmara sem exigir clique premido.
  if(locked||noLock){
    P.yaw-=e.movementX*.0024*settings.camSens;P.pitch=clamp(P.pitch-e.movementY*.0024*settings.camSens,-1.45,1.45);
  }
});

/* ---------- ciclo ---------- */
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000);last=t;tAcc+=dt;
  if(mode==='play'){update(dt);drawCompass()}
  else if(mode==='title'||mode==='scene'){
    const a=tAcc*.07;camera.position.set(Math.cos(a)*48,16,Math.sin(a)*48);camera.lookAt(0,5,0);
    dayT=(dayT+dt/300)%1;if(mode==='title'){P.x=camera.position.x;P.z=camera.position.z}
  }
  updateSky();Amb.tick(dt);
  {const sn=Math.sin(dayT*PI*2-PI/2);Music.setMood(mode==='title'||mode==='scene'?'title':combatT>0?'combat':sn<.05?'night':'day')}
  hand.visible=mode!=='title'&&mode!=='scene';
  renderer.render(scene,camera);
}

dayT=.28;P.y=terrainH(0,12);
openTitle();
requestAnimationFrame(frame);

})();
